<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ExpoJuy 2026 | Conectando Países, Creando Oportunidades</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal interactivo oficial de la ExpoJuy 2026 en Ciudad Cultural, Jujuy, Argentina. Minería sustentable, litio, energías limpias y el Corredor Bioceánico.">
  <link rel="icon" type="image/png" href="Img/expojuy26_isologotipo.png">

  <!-- Inmediato Theme Detector (anti-flicker) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('expojuy-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Boxicons Icons CDN -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body class="bg-neutral-surface-light font-sans text-on-surface antialiased overflow-x-clip relative selection:bg-brand-cyan-electric selection:text-brand-slate-dark">
  <app-root></app-root>
</body>
</html>
