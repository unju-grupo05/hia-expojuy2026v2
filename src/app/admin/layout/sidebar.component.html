<!-- Backdrop para móvil -->
@if (isMobileOpen()) {
  <div
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 lg:hidden transition-opacity"
    (click)="closeSidebar.emit()">
  </div>
}

<!-- Sidebar Drawer -->
<aside
  class="fixed lg:sticky top-0 left-0 h-screen w-64 z-50 bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800 flex flex-col justify-between transition-transform duration-300 ease-in-out lg:translate-x-0 shrink-0"
  [class.translate-x-0]="isMobileOpen()"
  [class.-translate-x-full]="!isMobileOpen()">

  <!-- Top: Logo & Branding -->
  <div>
    <div class="h-16 px-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
      <a routerLink="/admin/metrics" class="flex items-center gap-3 group">
        <img width="1510" height="1509"
          src="./img/expojuy26_isologotipo.png"
          alt="ExpoJuy Logo"
          class="h-9 w-auto drop-shadow-sm transition-transform group-hover:scale-105"
        />
        <div class="flex flex-col">
          <span class="text-xs font-black tracking-widest uppercase text-primary dark:text-brand-cyan-electric">
            ExpoJuy 2026
          </span>
          <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">
            Panel CMS
          </span>
        </div>
      </a>

      <!-- Botón cerrar para móvil -->
      <button
        type="button"
        (click)="closeSidebar.emit()"
        class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">
        <svg class="ms-icon text-xl" aria-hidden="true"><use href="#ms-close"/></svg>
      </button>
    </div>

    <!-- Navigation Section -->
    <div class="px-4 py-6">
      <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-3">
        Administración
      </p>

      <nav class="space-y-1.5">
        @for (item of navItems; track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-primary text-white shadow-md shadow-primary/25 font-semibold"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="onNavClick()"
            class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/80 hover:text-slate-900 dark:hover:text-white transition-all group">
            
            <div class="flex items-center gap-3">
              <svg class="ms-icon text-[20px] transition-transform group-hover:scale-110" aria-hidden="true"><use [attr.href]="(item.icon) | iconHref"/></svg>
              <span>{{ item.label }}</span>
            </div>

            @if (item.badge) {
              <span
                class="px-2 py-0.5 text-[10px] font-bold rounded-full transition-colors"
                [ngClass]="item.badgeColor">
                {{ item.badge }}
              </span>
            }
          </a>
        }
      </nav>
    </div>
  </div>

  <!-- Bottom: Portal shortcut & Status -->
  <div class="p-4 border-t border-slate-100 dark:border-slate-800 space-y-3">
    <!-- Link al sitio público -->
    <a
      routerLink="/"
      target="_blank"
      class="flex items-center justify-center gap-2 w-full px-3.5 py-2.5 rounded-xl text-xs font-bold text-primary dark:text-brand-cyan-electric bg-primary/5 hover:bg-primary/10 dark:bg-slate-800 dark:hover:bg-slate-700/80 border border-primary/20 dark:border-slate-700 transition-all">
      <svg class="ms-icon text-[16px]" aria-hidden="true"><use href="#ms-open_in_new"/></svg>
      <span>Ver Portal ExpoJuy</span>
    </a>

    <!-- Footer CMS info -->
    <div class="px-2 text-center">
      <p class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">
        ExpoJuy CMS v2.0 · 2026
      </p>
    </div>
  </div>
</aside>
