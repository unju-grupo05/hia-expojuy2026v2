<header class="h-16 px-4 md:px-8 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 sticky top-0 z-30 flex items-center justify-between gap-4">
  
  <!-- Izquierda: Hamburguesa Móvil y Título de la Sección -->
  <div class="flex items-center gap-3 md:gap-4">
    <button
      type="button"
      (click)="toggleMobileSidebar.emit()"
      class="lg:hidden p-2 rounded-xl text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
      aria-label="Abrir menú de navegación">
      <span class="material-symbols-outlined text-2xl">menu</span>
    </button>

    <div>
      <h1 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-tight">
        {{ sectionInfo().title }}
      </h1>
      <p class="hidden sm:block text-xs text-slate-500 dark:text-slate-400">
        {{ sectionInfo().subtitle }}
      </p>
    </div>
  </div>

  <!-- Derecha: Perfil de Administrador y Botón visible de Cerrar Sesión -->
  <div class="flex items-center gap-3 sm:gap-4">
    
    <!-- User Badge -->
    <div class="flex items-center gap-2.5 px-3 py-1.5 rounded-full bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200/60 dark:border-slate-700/60">
      <img
        [src]="authService.currentUser()?.avatar || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'"
        alt="Avatar Administrador"
        class="w-7 h-7 rounded-full object-cover ring-2 ring-primary/30"
      />
      <div class="hidden md:flex flex-col text-start">
        <span class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-none">
          {{ authService.currentUser()?.name || 'Administrador' }}
        </span>
        <span class="text-[10px] text-slate-500 dark:text-slate-400 font-medium leading-none mt-1">
          {{ authService.currentUser()?.role || 'Super Admin' }}
        </span>
      </div>
    </div>

    <!-- Botón Visible de Cerrar Sesión -->
    <button
      type="button"
      (click)="onLogout()"
      class="inline-flex items-center gap-1.5 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold text-rose-600 dark:text-rose-400 hover:text-white bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-600 dark:hover:bg-rose-600 border border-rose-200/80 dark:border-rose-900/40 transition-all duration-200 shadow-2xs hover:shadow-xs group"
      title="Cerrar sesión en el panel CMS">
      <span class="material-symbols-outlined text-[18px] transition-transform group-hover:-translate-x-0.5">
        logout
      </span>
      <span class="hidden sm:inline">Cerrar Sesión</span>
    </button>

  </div>
</header>
