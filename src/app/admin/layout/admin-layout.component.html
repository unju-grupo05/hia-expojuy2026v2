<div class="min-h-screen bg-slate-50 dark:bg-slate-950 flex text-slate-800 dark:text-slate-100 font-sans antialiased">
  
  <!-- Sidebar izquierdo -->
  <app-admin-sidebar
    [isMobileOpen]="isMobileSidebarOpen()"
    (closeSidebar)="closeMobileSidebar()"
  />

  <!-- Columna principal derecha -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
    
    <!-- Barra de navegación superior -->
    <app-admin-navbar (toggleMobileSidebar)="toggleMobileSidebar()" />

    <!-- Contenido de las páginas CMS -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
      <router-outlet></router-outlet>
    </main>

    <!-- Pie de página del panel -->
    <footer class="py-4 px-6 border-t border-slate-200/60 dark:border-slate-800 text-center text-xs text-slate-400 dark:text-slate-500">
      ExpoJuy 2026 CMS · Conectando Países, Creando Oportunidades · Todos los derechos reservados.
    </footer>

  </div>

</div>
