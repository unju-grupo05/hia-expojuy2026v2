<!-- Fixed Top Navbar -->
<header class="fixed top-0 left-0 w-full z-[100] bg-white/95 dark:bg-[#0B0813]/95 backdrop-blur-xl border-b border-primary/10 dark:border-white/10 shadow-sm transition-all duration-300">
  <div class="h-16 sm:h-20 max-w-[1340px] mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3">
    
    <!-- Vector Brand Logo / Identity -->
    <a class="flex items-center gap-2.5 group cursor-pointer" href="#hero-section">
      <img decoding="async" width="1510" height="1509" src="./img/expojuy26_isologotipo.png" alt="ExpoJuy Logo" class="h-8 sm:h-11 w-auto drop-shadow-md">
      <div class="hidden sm:flex flex-col border-l border-primary/20 dark:border-white/20 pl-3">
        <span class="text-[10px] uppercase font-bold tracking-widest text-primary dark:text-brand-cyan-electric">Jujuy · Argentina</span>
        <span class="text-xs font-semibold text-on-surface-variant dark:text-slate-300">9 al 12 Octubre 2026</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
   <nav class="hidden lg:flex items-center gap-5 xl:gap-7">
      <a class="nav-item py-2 text-sm font-bold text-slate-700 dark:text-purple-300 hover:text-brand-cyan-electric dark:hover:text-brand-cyan-electric transition-colors" href="#hero-section"
        [class.text-brand-cyan-electric]="isActiveSection('#hero-section')" [class.text-slate-700]="!isActiveSection('#hero-section')" [class.dark:text-purple-300]="!isActiveSection('#hero-section')">Inicio</a>
      <a class="nav-item py-2 text-sm font-bold text-slate-700 dark:text-purple-300 hover:text-brand-cyan-electric dark:hover:text-brand-cyan-electric transition-colors" href="#sobre-expojuy"
        [class.text-brand-cyan-electric]="isActiveSection('#sobre-expojuy')" [class.text-slate-700]="!isActiveSection('#sobre-expojuy')" [class.dark:text-purple-300]="!isActiveSection('#sobre-expojuy')">Ejes 2026</a>
      <a class="nav-item py-2 text-sm font-bold text-slate-700 dark:text-purple-300 hover:text-brand-cyan-electric dark:hover:text-brand-cyan-electric transition-colors" href="#mapa"
        [class.text-brand-cyan-electric]="isActiveSection('#mapa')" [class.text-slate-700]="!isActiveSection('#mapa')" [class.dark:text-purple-300]="!isActiveSection('#mapa')">Ubicación</a>
      <a class="nav-item py-2 text-sm font-bold text-slate-700 dark:text-purple-300 hover:text-brand-cyan-electric dark:hover:text-brand-cyan-electric transition-colors" href="#expositores"
        [class.text-brand-cyan-electric]="isActiveSection('#expositores')" [class.text-slate-700]="!isActiveSection('#expositores')" [class.dark:text-purple-300]="!isActiveSection('#expositores')">Expositores</a>
      <a class="nav-item py-2 text-sm font-bold text-slate-700 dark:text-purple-300 hover:text-brand-cyan-electric dark:hover:text-brand-cyan-electric transition-colors" href="#agenda"
        [class.text-brand-cyan-electric]="isActiveSection('#agenda')" [class.text-slate-700]="!isActiveSection('#agenda')" [class.dark:text-purple-300]="!isActiveSection('#agenda')">Agenda</a>
      <a class="nav-item py-2 text-sm font-bold text-slate-700 dark:text-purple-300 hover:text-brand-cyan-electric dark:hover:text-brand-cyan-electric transition-colors"     href="#novedades"
        [class.text-brand-cyan-electric]="isActiveSection('#novedades')" [class.text-slate-700]="!isActiveSection('#novedades')" [class.dark:text-purple-300]="!isActiveSection('#novedades')">Novedades</a>
      <a class="nav-item py-2 text-sm font-bold text-slate-700 dark:text-purple-300 hover:text-brand-cyan-electric dark:hover:text-brand-cyan-electric transition-colors"     href="#galeria"
        [class.text-brand-cyan-electric]="isActiveSection('#galeria')" [class.text-slate-700]="!isActiveSection('#galeria')" [class.dark:text-purple-300]="!isActiveSection('#galeria')">Galería</a>
    </nav>

    <!-- Header Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      <a class="hidden lg:inline-flex items-center justify-center gap-1.5 font-display text-xs xl:text-sm font-bold text-brand-slate-dark bg-brand-cyan-electric hover:bg-[#3be0ee] rounded-full px-5 py-2.5 transition-all shadow-md hover:-translate-y-0.5"
        href="https://opentickets.live/events/1"
        target="_blank"
        rel="noopener noreferrer">
        <svg class="ms-icon text-[18px]" aria-hidden="true"><use href="#ms-confirmation_number"/></svg>
        <span>Comprar Entradas</span>
      </a>

      <!-- Dark Mode Toggle -->
      <button aria-label="Cambiar tema" type="button" (click)="toggleTheme()"
        class="w-10 h-10 inline-flex items-center justify-center rounded-full text-primary dark:text-brand-cyan-electric bg-transparent hover:bg-primary/10 dark:hover:bg-white/10 transition-colors">
        @if (chrome.darkMode()) {
          <svg class="ms-icon text-[22px]" aria-hidden="true"><use href="#ms-light_mode"/></svg>
        } @else {
          <svg class="ms-icon text-[22px]" aria-hidden="true"><use href="#ms-dark_mode"/></svg>
        }
      </button>

      <!-- Mobile Hamburger Button (Garantizado para pantalla táctil) -->
      <button aria-label="Abrir menú" aria-controls="mobile-menu" [attr.aria-expanded]="chrome.mobileMenuOpen()" type="button" (click)="toggleMobileMenu()"
        class="lg:hidden w-10 h-10 flex items-center justify-center rounded-2xl text-slate-800 dark:text-white bg-slate-100 dark:bg-white/10 hover:bg-primary/10 transition-all shrink-0">
        @if (chrome.mobileMenuOpen()) {
          <svg class="ms-icon text-[24px]" aria-hidden="true"><use href="#ms-close"/></svg>
        } @else {
          <svg class="ms-icon text-[24px]" aria-hidden="true"><use href="#ms-menu"/></svg>
        }
      </button>
    </div>

  </div>

  <!-- Mobile Dropdown Menu (Cápsula Flotante con Z-Index 100) -->
  @if (chrome.mobileMenuOpen()) {
    <div class="lg:hidden fixed top-16 left-0 w-full z-[100] px-4 opacity-100 translate-y-0 transition-all duration-300 ease-out pointer-events-none" id="mobile-menu">
      <div class="max-w-md mx-auto rounded-3xl bg-[#0f0b1a] dark:bg-[#120d21] border border-white/15 shadow-[0_20px_50px_rgba(0,0,0,0.6)] backdrop-blur-2xl overflow-hidden pointer-events-auto flex flex-col max-h-[80vh]">
        
        <!-- Lista de Enlaces -->
        <nav class="flex flex-col p-2 overflow-y-auto divide-y divide-white/5" aria-label="Navegación móvil">
          @for (link of mobileLinks; track link.href) {
            <a class="mobile-nav-link flex items-center justify-between px-4 py-3 rounded-2xl text-sm font-semibold text-slate-200 hover:text-brand-cyan-electric hover:bg-white/5 transition-all" [href]="link.href" (click)="onMobileNavClick($event, link.href)">
              <span class="flex items-center gap-3">
                <svg class="ms-icon text-[20px] text-brand-cyan-electric" aria-hidden="true"><use [attr.href]="(link.icon) | iconHref"/></svg> 
                <span>{{ link.label }}</span>
              </span>
              <svg class="w-4 h-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
          }
        </nav>

        <!-- Botones de Acción al Pie -->
        <div class="p-3 bg-[#0a0712] border-t border-white/10 flex flex-col gap-2 shrink-0">
          <a class="mobile-nav-link w-full inline-flex items-center justify-center gap-2 py-2.5 rounded-xl bg-brand-cyan-electric text-slate-950 font-bold text-xs uppercase tracking-wider transition-all shadow-md active:scale-95"
            href="https://opentickets.live/events/1"
            target="_blank"
            rel="noopener noreferrer"
            (click)="toggleMobileMenu()">
            <svg class="ms-icon text-sm" aria-hidden="true"><use href="#ms-confirmation_number"/></svg> 
            <span>Comprar Entradas</span>
          </a>
        </div>

      </div>
    </div>
  }
</header>
