<section class="sponsors-marquee-section py-16 text-on-surface overflow-hidden">
  
  <!-- Encabezado de la Sección -->
  <div class="text-center mb-10 px-4">
    <p class="sponsors-eyebrow text-xs font-mono font-bold tracking-[0.35em] text-brand-cyan-accessible dark:text-[#00C2D1] uppercase mb-2">
      AUSPICIANTES & ALIANZAS ESTRATÉGICAS
    </p>
    <h2 class="font-display text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight">
      Empresas que conectan el mundo
    </h2>
  </div>

  <!-- Carrusel Infinito - Fila 1 (Se desplaza hacia la izquierda) -->
  <div class="marquee-wrapper relative flex overflow-hidden my-6">
    <!-- Degradados para suavizar los bordes lateralmente -->
    <div class="sponsors-fade-left pointer-events-none absolute left-0 top-0 bottom-0 w-24 z-10"></div>
    <div class="sponsors-fade-right pointer-events-none absolute right-0 top-0 bottom-0 w-24 z-10"></div>

    <div class="marquee-track flex gap-8 items-center animate-marquee">
      <!-- Grupo 1 de Sponsors -->
      <a *ngFor="let item of col1Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>
      <a *ngFor="let item of col2Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>

      <!-- Duplicado exacto para lograr el bucle infinito perfecto -->
      <a *ngFor="let item of col1Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card" aria-hidden="true" tabIndex="-1">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>
      <a *ngFor="let item of col2Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card" aria-hidden="true" tabIndex="-1">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>
    </div>
  </div>

  <!-- Carrusel Infinito - Fila 2 (Se desplaza en sentido inverso / derecha) -->
  <div class="marquee-wrapper relative flex overflow-hidden my-6">
    <div class="sponsors-fade-left pointer-events-none absolute left-0 top-0 bottom-0 w-24 z-10"></div>
    <div class="sponsors-fade-right pointer-events-none absolute right-0 top-0 bottom-0 w-24 z-10"></div>

    <div class="marquee-track flex gap-8 items-center animate-marquee-reverse">
      <!-- Grupo 2 de Sponsors -->
      <a *ngFor="let item of col3Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>
      <a *ngFor="let item of col1Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>

      <!-- Duplicado exacto -->
      <a *ngFor="let item of col3Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card" aria-hidden="true" tabIndex="-1">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>
      <a *ngFor="let item of col1Sponsors" [href]="item.website" target="_blank" rel="noopener noreferrer" class="sponsor-logo-card" aria-hidden="true" tabIndex="-1">
        <img decoding="async" [src]="item.img" [alt]="item.name" loading="lazy" class="sponsor-logo-img" />
      </a>
    </div>
  </div>

</section>
