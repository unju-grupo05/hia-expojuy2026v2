<!-- GALERÍA: Módulo interactivo de imágenes con expansión por selección -->
<section class="w-full py-20 lg:py-28 bg-gradient-to-b from-white via-surface-container-low to-white text-on-surface relative overflow-hidden dark:from-[#0e0c16] dark:via-[#151221] dark:to-[#0e0c16]" id="galeria">
  <div class="absolute top-20 right-0 w-80 h-80 bg-brand-cyan-electric/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-20 left-0 w-96 h-96 bg-brand-lavender-surface/70 rounded-full blur-3xl pointer-events-none dark:bg-primary/10"></div>

  <div class="max-w-[1340px] mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="reveal-on-scroll text-center max-w-3xl mx-auto mb-14 space-y-3">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-brand-cyan-electric/15 text-brand-cyan-accessible border border-brand-cyan-electric/30 text-xs font-bold uppercase tracking-wider">
        <span class="material-symbols-outlined text-sm">photo_library</span>
        Galería ExpoJuy 2026
      </div>
      <h2 class="blur-split font-display text-3xl sm:text-4xl lg:text-5xl font-extrabold text-brand-slate-dark tracking-tight">
        El Paisaje de Nuestra Feria
      </h2>
      <p class="text-base text-on-surface-variant leading-relaxed">
        Pasá el cursor (o hacé clic) sobre cada fotografía para expandirla y darle el foco principal.
      </p>
    </div>

    <!-- Acordeón interactivo (Patrón Skiper 52 / HoverExpand_001) -->

          <span class="gallery-ac-sub">Sede Central</span>
        </figcaption>
      </figure>

      <figure class="gallery-ac-item reveal-on-scroll" role="option" aria-selected="false" tabindex="0">

        <div class="gallery-ac-overlay"></div>
        <figcaption class="gallery-ac-label">
          <span class="gallery-ac-name">Arte y Tradición de Nuestra Tierra</span>
          <span class="gallery-ac-sub">Identidad, colores y artesanías que representan el orgullo de La Quiaca y la Puna.</span>
        </figcaption>

      <figure class="gallery-ac-item reveal-on-scroll" role="option" aria-selected="false" tabindex="0">
