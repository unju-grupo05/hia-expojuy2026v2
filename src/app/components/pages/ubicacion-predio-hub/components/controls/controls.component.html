<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 w-full">
  <!-- Search Bar -->
  <div class="w-full md:w-80">
    <div class="relative">
      <input 
        class="map-search-input" 
        id="masterplan-search" 
        [value]="dataService.searchQuery()" 
        (input)="onSearchChange($event)" 
        placeholder="Buscar stand, empresa o rubro..." 
        type="text">
      <svg class="ms-icon search-icon" aria-hidden="true"><use href="#ms-search"/></svg>
    </div>
  </div>

  <!-- Botones de Filtro por Estado Comercial: Todos, Disponibles, Reservados, Cedidos -->
  <div class="flex flex-wrap items-center gap-2" id="masterplan-status-tabs">
    <button 
      *ngFor="let f of statusFilters" 
      class="filter-btn"
      [class.active-filter]="dataService.filterStatus() === f.key" 
      (click)="setStatusFilter(f.key)"
      type="button">
      {{ f.label }}
    </button>
  </div>
</div>
