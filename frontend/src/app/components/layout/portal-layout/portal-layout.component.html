<app-header />

<!-- Barra de progreso de lectura global -->
<div class="fixed top-0 left-0 w-full h-[3px] z-[60] pointer-events-none bg-transparent">
  <div class="h-full bg-gradient-to-r from-brand-cyan-electric via-brand-cyan-accessible to-primary shadow-[0_0_12px_rgba(0,194,209,0.85)] transition-all duration-100 ease-out"
    id="reading-progress" [style.width.%]="chrome.readingProgress()"></div>
</div>

<!-- Side-Rail Tracker: PUNTOS A LA IZQUIERDA CON TOOLTIP REVELABLE AL HOVER -->
<aside class="fixed left-5 top-1/2 -translate-y-1/2 z-40 hidden xl:flex flex-col items-start pointer-events-auto transition-opacity duration-300">
  <nav aria-label="Navegación de secciones" class="flex flex-col items-start gap-3.5 py-2 px-1">
    @for (item of railItems; track item.id) {
      <a class="rail-indicator group flex items-center gap-3 transition-all cursor-pointer h-6" [attr.data-nav-target]="item.id" [href]="'#' + item.id" [title]="item.title" (click)="onRailClick($event, item.id)">
        <span class="rail-dot shrink-0 w-2.5 h-2.5 rounded-full transition-all duration-300 group-hover:scale-150 group-hover:bg-brand-cyan-electric"
          [class.bg-brand-cyan-electric]="isActiveSection(item.id)"
          [class.scale-150]="isActiveSection(item.id)"
          [class.bg-slate-400/60]="!isActiveSection(item.id)"
          [class.dark:bg-slate-600]="!isActiveSection(item.id)"></span>
        <span class="rail-label whitespace-nowrap text-[10px] font-bold tracking-wider uppercase opacity-0 translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-200 text-slate-800 dark:text-white bg-white/90 dark:bg-slate-900/90 backdrop-blur-md px-2.5 py-1 rounded-md shadow-md border border-slate-200 dark:border-slate-700 pointer-events-none">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>

<main class="w-full">
  <router-outlet />
</main>

<app-footer />
