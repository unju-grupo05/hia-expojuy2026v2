<div class="flex flex-col gap-3 w-full">
  <!-- Fila Superior: Buscador y Filtro por Estado Comercial -->
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 w-full">
    
    <!-- Search Bar -->
    <div class="w-full lg:w-80 flex-shrink-0">
      <div class="relative">
        <input class="map-search-input" id="masterplan-search" [value]="dataService.searchQuery()"
          (input)="onSearchChange($event)" placeholder="Buscar stand, empresa o rubro..." type="text">
        <svg class="ms-icon search-icon" aria-hidden="true">
          <use href="#ms-search" />
        </svg>
      </div>
    </div>

    <!-- Fila de Rubros con Scroll Horizontal (Ndéve g̃uarã techapyrã) -->
    <div class="flex items-center gap-2 w-full min-w-0">
      <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mr-1 hidden sm:inline flex-shrink-0">
        Rubro:
      </span>
      
      <!-- Contenedor con scroll horizontal -->
      <div class="category-scroll-container flex items-center gap-2 overflow-x-auto flex-nowrap w-full py-1" id="masterplan-category-tabs">
        <button *ngFor="let c of categoryFilters" class="filter-btn text-xs py-1.5 px-3 flex-shrink-0 whitespace-nowrap"
          [class.active-filter]="dataService.activeFilter() === c.key" (click)="setCategoryFilter(c.key)" type="button">
          {{ c.label }}
        </button>
      </div>
    </div>

  </div>
</div>
