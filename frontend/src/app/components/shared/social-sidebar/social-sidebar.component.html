<aside class="social-sidebar" [class.is-open]="isOpen()" aria-label="Menú flotante de redes y efectos">
  <button
    type="button"
    class="social-sidebar__fab"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="isOpen() ? 'Cerrar menú' : 'Abrir menú de redes y efectos'"
    (click)="toggleMenu()"
    (pointerdown)="onFabPressStart($event)"
    (pointerup)="onFabPressEnd()"
    (pointerleave)="onFabPressEnd()"
    (pointercancel)="onFabPressEnd()"
  >
    <svg class="ms-icon" aria-hidden="true"><use href="#ms-add"/></svg>
  </button>

  <!-- Ayuda: aparece sola una vez, y tras una pulsación larga en táctil. -->
  <span class="social-sidebar__hint" role="tooltip" [class.is-visible]="showHint()">
    Redes sociales y ajuste visual
  </span>

  <button
    type="button"
    class="social-sidebar__item social-sidebar__star"
    [class.is-active]="stardustEnabled"
    [attr.aria-pressed]="stardustEnabled"
    [attr.aria-label]="stardustEnabled ? 'Desactivar fondo de estrellas' : 'Activar fondo de estrellas'"
    [title]="stardustEnabled ? 'Desactivar fondo de estrellas' : 'Activar fondo de estrellas'"
    (click)="toggleStardust()"
  >
    <svg class="social-sidebar__star-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M12 2a1 1 0 0 1 .947.679q.108.309.226.613c.15.387.367.922.639 1.51c.559 1.21 1.294 2.526 2.077 3.31c.783.782 2.1 1.518 3.308 2.076a26 26 0 0 0 2.117.863c.404.139.686.518.686.949a1 1 0 0 1-.679.947q-.309.107-.613.226c-.387.15-.922.367-1.51.639c-1.21.559-2.526 1.294-3.31 2.077c-.782.783-1.517 2.1-2.076 3.308a26 26 0 0 0-.863 2.117A1.01 1.01 0 0 1 12 22a1.01 1.01 0 0 1-.95-.686a26 26 0 0 0-.862-2.116c-.558-1.21-1.294-2.526-2.077-3.31c-.783-.782-2.1-1.517-3.308-2.076a26 26 0 0 0-2.123-.865a1.001 1.001 0 0 1-.001-1.894q.309-.108.613-.226c.387-.15.922-.367 1.51-.639c1.21-.558 2.526-1.294 3.31-2.077c.782-.783 1.518-2.1 2.076-3.308c.272-.589.49-1.124.64-1.511c.097-.252.181-.51.287-.759A1 1 0 0 1 12 2"
      />
    </svg>
  </button>

  <a
    *ngFor="let net of socials"
    class="social-sidebar__item social-sidebar__link"
    [href]="net.url"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="net.label"
    [title]="net.label"
  >
    <svg class="ms-icon" aria-hidden="true"><use [attr.href]="'#bx-' + net.icon"/></svg>
  </a>

  <div
    class="social-sidebar__bubble"
    [class.is-visible]="showBubble()"
    [attr.aria-hidden]="showBubble() ? null : 'true'"
    role="status"
  >
    <p class="social-sidebar__bubble-text">
      <span aria-hidden="true">✨</span>
      ¡Personaliza tu vista y conéctate en nuestras redes sociales aquí!
    </p>
    <button
      type="button"
      class="social-sidebar__bubble-close"
      aria-label="Cerrar mensaje"
      (click)="dismissBubble()"
    >
      <svg class="ms-icon" aria-hidden="true"><use href="#ms-close"/></svg>
    </button>
  </div>
</aside>
