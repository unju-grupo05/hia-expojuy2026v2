name: expojuy

services:
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: expojuy-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - app

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: expojuy-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - data
      - app

  grafana:
    image: grafana/grafana:11.2.0
    container_name: expojuy-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-cambiar_password_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: expojuy-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - app

  cadvisor:
    # v0.54+ soporta el image store con containerd-snapshotter (Docker 29+);
    # con versiones anteriores no registra los contenedores y no expone sus métricas.
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: expojuy-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--store_container_labels=true'
      - '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project'
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - app

  postgres-exporter-primary:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: expojuy-postgres-exporter-primary
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - data

  postgres-exporter-replica-1:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: expojuy-postgres-exporter-replica-1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica-1:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - data

  postgres-exporter-replica-2:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: expojuy-postgres-exporter-replica-2
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica-2:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - data

volumes:
  prometheus-data:
    name: expojuy_prometheus-data
  grafana-data:
    name: expojuy_grafana-data