name: expojuy

services:
  postgres:
    # Postgres 17 con la extensión pgvector disponible, prevista para el chatbot RAG.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Solo accesible desde esta máquina (scripts de carga, psql); nunca desde la red.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  backup:
    # pg_dump programado con rotación diaria/semanal/mensual.
    image: prodrigestivill/postgres-backup-local:17
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  backend:
    build:
      context: ../backend
    image: expojuy-backend:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      # Confía en proxies de redes privadas (Nginx en Docker) para leer la IP real del cliente.
      TRUST_PROXY: uniquelocal
    volumes:
      - uploads:/app/uploads
    # Sin puerto publicado: solo se accede a través de Nginx (/api).
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - data

  frontend:
    build:
      context: ../frontend
    image: expojuy-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - app

networks:
  # app: tráfico web. data: base de datos y sus herramientas.
  # Solo se conecta a data quien necesita la base; el frontend no.
  app:
  data:

volumes:
  pgdata:
  pgadmin-data:
  uploads:
