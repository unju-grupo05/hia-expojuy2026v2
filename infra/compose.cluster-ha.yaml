# =============================================================================
# ExpoJuy 2026 - Clúster de Alta Disponibilidad (HA) de 3 Nodos
# 1 Nodo Principal + 2 Nodos Esclavos (Standbys)
# Balanceo de Carga (HAProxy) + Failover y Promoción Automática (Sentinel)
# Uso: docker compose -f compose.yaml -f compose.cluster-ha.yaml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # NODO ESCLAVO 1 (Standby Replica 1)
  # ---------------------------------------------------------------------------
  postgres-replica-1:
    image: pgvector/pgvector:pg17
    container_name: expojuy-postgres-replica-1
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PGUSER: ${POSTGRES_USER}
    volumes:
      - pgdata-replica-1:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_1_PORT:-5434}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo ">>> [STANDBY-1] Inicializando nodo réplica desde el primario..."
          until pg_isready -h postgres -p 5432 -U $${POSTGRES_USER}; do
            echo "Esperando que postgres primario esté disponible..."
            sleep 2
          done
          PGPASSWORD="$${POSTGRES_REPLICATION_PASSWORD}" pg_basebackup -h postgres -p 5432 -U $${POSTGRES_REPLICATION_USER} -D /var/lib/postgresql/data -Fp -Xs -P -R
          chmod 700 /var/lib/postgresql/data
          chown -R postgres:postgres /var/lib/postgresql/data
          echo ">>> [STANDBY-1] Clonación completada."
        fi
        exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby=on

  # ---------------------------------------------------------------------------
  # NODO ESCLAVO 2 (Standby Replica 2)
  # ---------------------------------------------------------------------------
  postgres-replica-2:
    image: pgvector/pgvector:pg17
    container_name: expojuy-postgres-replica-2
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PGUSER: ${POSTGRES_USER}
    volumes:
      - pgdata-replica-2:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_2_PORT:-5435}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo ">>> [STANDBY-2] Inicializando nodo réplica desde el primario..."
          until pg_isready -h postgres -p 5432 -U $${POSTGRES_USER}; do
            echo "Esperando que postgres primario esté disponible..."
            sleep 2
          done
          PGPASSWORD="$${POSTGRES_REPLICATION_PASSWORD}" pg_basebackup -h postgres -p 5432 -U $${POSTGRES_REPLICATION_USER} -D /var/lib/postgresql/data -Fp -Xs -P -R
          chmod 700 /var/lib/postgresql/data
          chown -R postgres:postgres /var/lib/postgresql/data
          echo ">>> [STANDBY-2] Clonación completada."
        fi
        exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby=on

  # ---------------------------------------------------------------------------
  # SENTINEL & AUTO-FAILOVER MANAGER
  # Monitorea el estado de los 3 nodos y ejecuta la promoción automática ante fallas
  # ---------------------------------------------------------------------------
  db-failover-manager:
    image: node:22.23.4-alpine
    container_name: expojuy-db-failover-manager
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./failover-manager:/app
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PRIMARY_HOST: postgres
      REPLICA_1_HOST: postgres-replica-1
      REPLICA_2_HOST: postgres-replica-2
      CHECK_INTERVAL_MS: 2000
      FAILOVER_THRESHOLD: 3
    ports:
      - "127.0.0.1:${HA_SENTINEL_PORT:-8008}:8008"
    command: ["node", "index.js"]
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8008/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # BALANCEADOR DE CARGA (HAPROXY)
  # - Puerto 5432 (interno) / 5437 (host): Escrituras hacia el nodo Primario activo
  # - Puerto 5436 (interno) / 5438 (host): Lecturas balanceadas en Round-Robin
  # - Puerto 8404: Dashboard Web en tiempo real
  # ---------------------------------------------------------------------------
  db-loadbalancer:
    image: haproxy:3.0-alpine
    container_name: expojuy-db-loadbalancer
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${HA_PROXY_WRITE_PORT:-5437}:5432"
      - "127.0.0.1:${HA_PROXY_READ_PORT:-5438}:5436"
      - "127.0.0.1:${HA_PROXY_STATS_PORT:-8404}:8404"
    networks:
      - data
      - app
    depends_on:
      db-failover-manager:
        condition: service_healthy

  # En el modo HA, la aplicación escribe a través del proxy del líder activo.
  backend:
    environment:
      DB_HOST: db-loadbalancer
      DB_PORT: 5432
    depends_on:
      db-loadbalancer:
        condition: service_started

volumes:
  pgdata-replica-1:
  pgdata-replica-2:
