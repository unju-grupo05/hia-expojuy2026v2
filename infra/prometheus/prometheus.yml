global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: compose_service

  - job_name: "postgres-cluster"
    static_configs:
      - targets: ["postgres-exporter-primary:9187"]
        labels:
          node: "postgres-primary"
          role: "primary"
      - targets: ["postgres-exporter-replica-1:9187"]
        labels:
          node: "postgres-replica-1"
          role: "replica"
      - targets: ["postgres-exporter-replica-2:9187"]
        labels:
          node: "postgres-replica-2"
          role: "replica"
