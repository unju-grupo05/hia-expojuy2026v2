groups:
  - name: expojuy_alerts
    rules:
      # 1. Alerta por uso elevado de CPU en el Host
      - alert: HighCpuUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)) > 85
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Uso de CPU elevado en {{ $labels.instance }}"
          description: "El uso de CPU del host supera el 85% durante más de 10 segundos."

      # 2. Alertas individuales por caída de cada nodo PostgreSQL
      - alert: PostgresPrimaryDown
        expr: pg_up{node="postgres-primary"} == 0 or up{job="postgres-cluster", node="postgres-primary"} == 0
        for: 5s
        labels:
          severity: critical
          node: "postgres-primary"
        annotations:
          summary: "Nodo Primario PostgreSQL caído (postgres)"
          description: "El nodo principal postgres:5432 no responde o su exportador está inaccesible."

      - alert: PostgresReplica1Down
        expr: pg_up{node="postgres-replica-1"} == 0 or up{job="postgres-cluster", node="postgres-replica-1"} == 0
        for: 5s
        labels:
          severity: critical
          node: "postgres-replica-1"
        annotations:
          summary: "Nodo Réplica 1 PostgreSQL caído (postgres-replica-1)"
          description: "El nodo secundario postgres-replica-1:5432 no responde o su exportador está inaccesible."

      - alert: PostgresReplica2Down
        expr: pg_up{node="postgres-replica-2"} == 0 or up{job="postgres-cluster", node="postgres-replica-2"} == 0
        for: 5s
        labels:
          severity: critical
          node: "postgres-replica-2"
        annotations:
          summary: "Nodo Réplica 2 PostgreSQL caído (postgres-replica-2)"
          description: "El nodo secundario postgres-replica-2:5432 no responde o su exportador está inaccesible."

      # 3. Alerta por retraso elevado en la replicación de streaming
      - alert: PostgresReplicationLagHigh
        expr: pg_stat_replication_bytes_lag > 10485760
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "Retraso de replicación elevado en {{ $labels.node }}"
          description: "El lag de replicación supera los 10 MB durante más de 15 segundos."

      # 4. Alerta por exceso de conexiones activas por nodo PostgreSQL
      - alert: PostgresHighConnections
        expr: pg_stat_activity_count > 80
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Alto número de conexiones activas en {{ $labels.node }}"
          description: "El nodo {{ $labels.node }} registra más de 80 conexiones activas simultáneas."

      # 5. Alerta por reinicios frecuentes en contenedores Docker (cAdvisor corregida)
      # container_start_time_seconds es un gauge (timestamp de arranque), no un counter:
      # increase() no sirve para contar reinicios; changes() detecta cada cambio de arranque.
      - alert: ContainerFrequentRestarts
        expr: sum by (compose_service) (changes(container_start_time_seconds{compose_service!=""}[5m])) > 2
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: "Reinicios frecuentes en contenedor {{ $labels.compose_service }}"
          description: "El servicio {{ $labels.compose_service }} se ha reiniciado más de 2 veces en los últimos 5 minutos."
