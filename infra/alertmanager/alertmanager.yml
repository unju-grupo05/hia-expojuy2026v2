global:
  resolve_timeout: 2m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'n8n-alertas'

receivers:
  - name: 'n8n-alertas'
    webhook_configs:
      - url: 'http://expojuy-n8n:5678/webhook/alertmanager'
        send_resolved: true
