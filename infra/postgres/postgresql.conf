# =============================================================================
# ExpoJuy 2026 - Configuración del motor PostgreSQL 17
# Se monta como solo lectura en el primario y en las réplicas, y se activa con
# -c config_file=/etc/postgresql/postgresql.conf (ver compose.yaml y compose.cluster-ha.yaml).
# Lo que no está acá toma el valor por defecto del motor.
# =============================================================================

# -----------------------------------------------------------------------------
# Conexiones
# -----------------------------------------------------------------------------
# WARNING: sin esta línea Postgres escucha solo dentro del contenedor y ni el backend,
# ni pgAdmin, ni las réplicas se pueden conectar. No expone la base fuera de Docker:
# el puerto del host se publica solo en 127.0.0.1 (ver compose.yaml).
listen_addresses = '*'

# -----------------------------------------------------------------------------
# Estadísticas de consultas
# -----------------------------------------------------------------------------
# pg_stat_statements registra tiempos por consulta; lo usan el análisis de optimización
# y el monitoreo. Requiere reinicio.
shared_preload_libraries = 'pg_stat_statements'
# Incluye también las consultas que se ejecutan dentro de funciones.
pg_stat_statements.track = all

# -----------------------------------------------------------------------------
# Replicación (clúster: 1 primario + 2 réplicas)
# -----------------------------------------------------------------------------
# Coinciden con los valores por defecto de PostgreSQL 17; se dejan explícitos para
# documentar que el primario está preparado para replicar.
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
# Permite consultas de solo lectura en las réplicas. En el primario no tiene efecto.
hot_standby = on

# -----------------------------------------------------------------------------
# Rendimiento
# Valores pensados para un host de 16 GB de RAM con ~8 GB para Docker, compartidos
# con el resto de los contenedores (clúster, monitoreo, herramientas).
# -----------------------------------------------------------------------------
# Caché propia de Postgres (por defecto 128MB). No se usa el 25% de 8 GB porque el
# clúster levanta 3 nodos con este mismo valor. Requiere reinicio.
shared_buffers = 1GB

# Estimación de la caché total disponible (Postgres + sistema operativo) que usa el
# planificador para elegir entre índices y recorridos completos. No reserva memoria.
# Por defecto 4GB; se baja a un valor realista para la memoria del contenedor.
effective_cache_size = 3GB

# Memoria para cada ordenamiento o hash antes de usar archivos temporales en disco
# (por defecto 4MB). NOTE: se reserva por operación y por conexión, así que un valor
# muy alto con muchas conexiones puede agotar la memoria.
work_mem = 32MB

# Memoria para CREATE INDEX, VACUUM y ALTER TABLE (por defecto 64MB). Acelera el
# mantenimiento sobre las tablas de 6 millones de filas.
maintenance_work_mem = 512MB

# Costo relativo de una lectura aleatoria (por defecto 4, pensado para disco rígido).
# En SSD la lectura aleatoria cuesta casi lo mismo que la secuencial, así que el
# planificador elige índices con más facilidad.
random_page_cost = 1.1
