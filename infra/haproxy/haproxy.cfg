global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    timeout connect 3000ms
    timeout client 60000ms
    timeout server 60000ms
    timeout check 2000ms
    default-server init-addr last,libc,none resolvers docker resolve-prefer ipv4

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 2s

# -----------------------------------------------------------------------------
# DASHBOARD DE ESTADÍSTICAS WEB EN TIEMPO REAL (http://127.0.0.1:8404/stats)
# Credenciales inyectadas desde infra/.env vía environment del contenedor
# (comillas dobles obligatorias: HAProxy solo expande variables entre comillas)
# -----------------------------------------------------------------------------
frontend stats
    mode http
    bind 0.0.0.0:8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats auth "${HA_PROXY_STATS_USER}:${HA_PROXY_STATS_PASSWORD}"

# -----------------------------------------------------------------------------
# FRONTEND ESCRITURAS (MASTER / WRITE PROXY) -> Puerto 5432
# Enruta automáticamente al nodo que actualmente es el Primario (Líder)
# Controlado dinámicamente mediante Agent-Check hacia db-failover-manager
# -----------------------------------------------------------------------------
frontend pg_cluster_write_front
    bind 0.0.0.0:5432
    default_backend pg_cluster_write_back

backend pg_cluster_write_back
    mode tcp
    balance roundrobin
    server node1 postgres:5432 check agent-check agent-addr db-failover-manager agent-port 8001 agent-inter 2s fall 2 rise 1
    server node2 postgres-replica-1:5432 check agent-check agent-addr db-failover-manager agent-port 8002 agent-inter 2s fall 2 rise 1
    server node3 postgres-replica-2:5432 check agent-check agent-addr db-failover-manager agent-port 8003 agent-inter 2s fall 2 rise 1

# -----------------------------------------------------------------------------
# FRONTEND LECTURAS (READ LOAD BALANCER) -> Puerto 5436
# Balancea consultas SELECT en Round-Robin entre los 3 nodos del clúster
# -----------------------------------------------------------------------------
frontend pg_cluster_read_front
    bind 0.0.0.0:5436
    default_backend pg_cluster_read_back

backend pg_cluster_read_back
    mode tcp
    balance roundrobin
    server node1 postgres:5432 check inter 2s fall 2 rise 1
    server node2 postgres-replica-1:5432 check inter 2s fall 2 rise 1
    server node3 postgres-replica-2:5432 check inter 2s fall 2 rise 1
