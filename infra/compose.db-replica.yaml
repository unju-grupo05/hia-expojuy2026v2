# =============================================================================
# ExpoJuy 2026 - Replicación Streaming Física (Standby Replica)
# Módulo de Infraestructura DBA - Integrante 2
# Uso combinado: docker compose -f compose.yaml -f compose.db-replica.yaml up -d
# =============================================================================

services:
  postgres-replica:
    image: pgvector/pgvector:pg17
    container_name: expojuy-postgres-replica
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    # Puerto en localhost para verificación DBA y monitoreo aislado. Nunca expuesto a la red pública.
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_PORT:-5434}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-replica:
